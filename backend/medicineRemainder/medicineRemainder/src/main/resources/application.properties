spring.application.name=medicineRemainder

# ==========================
# Database
# ==========================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# CORS
# ==========================

spring.web.cors.allowed-origins=*

# ==========================
# File Upload
# ==========================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================
# Gemini
# ==========================

gemini.api.key=${GEMINI_API_KEY}

# ==========================
# Firebase
# ==========================

firebase.config.base64=${FIREBASE_CONFIG_BASE64}

# ==========================
# Frontend
# ==========================

app.frontend.url=${APP_FRONTEND_URL}

# ==========================
# Server
# ==========================

server.port=${PORT:8080}

# ==========================
# Google OAuth
# =========================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://medorax-0.onrender.com/login/oauth2/code/google